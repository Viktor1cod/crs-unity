<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101722;color:#fff;font-family:Arial,sans-serif}
    #game{position:fixed;inset:0;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);box-sizing:border-box}
    canvas{display:block;width:100%;height:100%;touch-action:none;outline:none}
    #loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;background:#101722;gap:16px;text-align:center;padding:24px}
    progress{width:min(320px,80vw);accent-color:#58bba0}button{padding:12px 24px;font-size:18px}
  </style>
</head>
<body>
  <div id="game"><canvas id="unity-canvas" tabindex="0"></canvas></div>
  <div id="loading" role="status"><span id="status">Загрузка игры…</span><progress id="progress" max="1" value="0"></progress><button id="retry" hidden>Повторить</button></div>
  <script src="platform.js"></script>
  <script src="Build/{{{ LOADER_FILENAME }}}"></script>
  <script>
    const ru = CRSPlatform.language === 'ru';
    document.documentElement.lang = ru ? 'ru' : 'en';
    const status = document.getElementById('status');
    status.textContent = ru ? 'Загрузка игры…' : 'Loading game…';
    const retry = document.getElementById('retry');
    retry.textContent = ru ? 'Повторить' : 'Retry';
    retry.onclick = () => location.reload();
    CRSPlatform.ready.then(() => createUnityInstance(document.getElementById('unity-canvas'), {
#if PROGRESSIVE_ASSET_LOADING
      primaryDataUrls: {{{ JSON.stringify(PRIMARY_DATA_FILES) }}},
      secondaryDataUrls: {{{ JSON.stringify(SECONDARY_DATA_FILES) }}},
#else
      dataUrl: 'Build/{{{ DATA_FILENAME }}}',
#endif
      frameworkUrl: 'Build/{{{ FRAMEWORK_FILENAME }}}',
#if USE_WASM
      codeUrl: 'Build/{{{ CODE_FILENAME }}}',
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: 'Build/{{{ SYMBOLS_FILENAME }}}',
#endif
      streamingAssetsUrl: 'StreamingAssets',
      companyName: {{{ JSON.stringify(COMPANY_NAME) }}},
      productName: {{{ JSON.stringify(PRODUCT_NAME) }}},
      productVersion: {{{ JSON.stringify(PRODUCT_VERSION) }}},
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2)
    }, value => document.getElementById('progress').value = value)).then(instance => {
      CRSPlatform.attach(instance);
      document.getElementById('loading').remove();
    }).catch(error => {
      console.error('Game initialization failed', error);
      status.textContent = ru ? 'Не удалось загрузить игру. Проверьте соединение и повторите.' : 'Unable to load the game. Check your connection and retry.';
      document.getElementById('progress').hidden = true;
      retry.hidden = false;
    });
  </script>
</body>
</html>
