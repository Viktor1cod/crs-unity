# Release: по тегу вида v0.1.0 собирает Web и Android (APK)
# и публикует их в разделе Releases на GitHub.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

# Unity Personal allows one active seat: run Unity jobs one at a time
concurrency:
  group: unity-license
  cancel-in-progress: false

env:
  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
  UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
  UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}

jobs:
  build:
    name: Build ${{ matrix.targetPlatform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        targetPlatform: [WebGL, Android]
    steps:
      # Образ Unity для Android большой, освобождаем место на раннере
      - name: Free disk space
        if: matrix.targetPlatform == 'Android'
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.targetPlatform }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: Library-${{ matrix.targetPlatform }}-

      - name: Build
        uses: game-ci/unity-builder@v4
        with:
          targetPlatform: ${{ matrix.targetPlatform }}
          buildName: crs
          versioning: Tag
          androidExportType: androidPackage

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.targetPlatform }}
          path: build/${{ matrix.targetPlatform }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Package files
        run: |
          cd artifacts
          (cd build-WebGL && zip -qr ../crs-web-${GITHUB_REF_NAME}.zip crs)
          cp build-Android/crs.apk crs-${GITHUB_REF_NAME}.apk
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Car Reseller Simulator ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/crs-web-${{ github.ref_name }}.zip
            artifacts/crs-${{ github.ref_name }}.apk
